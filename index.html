<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="利益計算"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="format-detection" content="telephone=no"><link rel="apple-touch-icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAALQAAAC0AgMAAABAo+6hAAAADFBMVEX///9Q34RmcIAUIzxpdVOTAAABxElEQVR42u2XMVLDQAxFvwyFGZghJWUK+qSkI0fhKHscTkFyBA5AETpKVyHMJBaFFke2tV6HgiGgLTKz9rPy968kr4lxxCjgtNNOO+20004fRb8SEdE8zj6IiGiSpG8AAOs4ewMAzJP0OQBgF2fyVEjSMtnG2QoAsNAAtU4FBACQS1wAQLFPe7JSvzUA4KJtCushUu+ZmVkEXbfut2OLXZWSPx3YnSsAwAsA4Fk9b9PaFL0G2xMxRXygviXdPAkAUK8aGwkDnihTRM4lD3iiTBH6djBjyyZDKsOSrhLJqDNmlmxatm93PDk4YVnSq50QU8S2pEsv4p7UahlJ3dHCGVdGTvUcbIqt6peZoeSr2IwyM2iZv1tlZuiOPssiC87ojuGerDIzYovgO9MS7tGVijTL0jtFL7s3u3kCvRLO9lga6r/9K8F6cKCztaLt/Z32N2kyvnQJVp9KxQ6JnLHphd2nEvRUdZY8PTHefWm6NBv9b94dr8v/SrM6CcqpcO8OOu200z92KnAHT5OW09PmIRv18RB7nY1aKyUhLyI0dD1C8rqhtyPo7cnvZTkCLBt6zB9Mv7k75unZWp93CKeddtrpY8YnXcZd/jnEbk8AAAAASUVORK5CYII="><title>メルカリ利益計算</title><style>*{box-sizing:border-box}body{margin:0;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;background:#f4f5f8;color:#18202d;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif}.wrap{max-width:500px;margin:auto;padding:calc(24px + env(safe-area-inset-top,0px)) 18px calc(48px + env(safe-area-inset-bottom,0px))}h1{font-size:23px;margin:10px 0 6px}.sub{color:#64748b;font-size:13px;margin-bottom:24px}.panel{background:white;border-radius:20px;padding:20px;box-shadow:0 5px 24px #1520360b;margin-bottom:16px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px}label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}input{-webkit-appearance:none;appearance:none;width:100%;font-size:22px;font-weight:700;padding:12px 10px;border:1px solid #d6dbe4;border-radius:12px;background:#fff;min-width:0}input:focus{outline:2px solid #4779dc;border-color:transparent}.unit{color:#64748b;font-size:12px;margin-top:5px}.result{background:#14233c;color:white;border-radius:20px;padding:22px;margin:16px 0}.result .heading{font-size:14px;opacity:.8}.result .money{font-size:44px;font-weight:800;letter-spacing:-1px;margin:8px 0}.result .money.loss{color:#ffb6ae}.details{display:grid;grid-template-columns:1fr 1fr;gap:12px;border-top:1px solid #ffffff30;padding-top:15px}.details small{display:block;color:#c7d2e0;margin-bottom:4px}.details strong{font-size:19px}table{width:100%;border-collapse:collapse;font-size:14px}td{padding:11px 0;border-bottom:1px solid #edf0f4}td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}tr:last-child td{border-bottom:0}.buttons{display:flex;gap:10px}button{-webkit-appearance:none;min-height:48px;border:0;border-radius:12px;padding:13px 16px;font-size:14px;font-weight:700;flex:1;background:#e7eaf0;color:#172234}button.primary{background:#1f58c8;color:white}.note{font-size:12px;line-height:1.7;color:#64748b;margin:15px 3px}</style></head><body><main class="wrap"><h1>📦 メルカリ利益計算</h1><div class="sub">お店でもサッと計算！ 仕入れ判断のおともに 💰</div><section class="panel"><div class="fields"><div><label for="cost">仕入れ価格</label><input id="cost" type="number" inputmode="decimal" min="0" value="110"><div class="unit">円</div></div><div><label for="price">販売価格</label><input id="price" type="number" inputmode="decimal" min="0" value="600"><div class="unit">円</div></div><div><label for="shipping">送料</label><input id="shipping" type="number" inputmode="decimal" min="0" value="160"><div class="unit">円</div></div><div><label for="packing">梱包費</label><input id="packing" type="number" inputmode="decimal" min="0" value="20"><div class="unit">円</div></div></div></section><section class="result" aria-live="polite"><div class="heading">手元に残る利益</div><div class="money" id="profit">250円</div><div class="details"><div><small>利益率（売上に対して）</small><strong id="margin">41.7%</strong></div><div><small>仕入れ利益率（ROI）</small><strong id="roi">227.3%</strong></div></div></section><section class="panel"><table><tr><td>販売価格</td><td id="p1"></td></tr><tr><td>販売手数料（10％）</td><td id="fee"></td></tr><tr><td>仕入れ価格</td><td id="p2"></td></tr><tr><td>送料</td><td id="p3"></td></tr><tr><td>梱包費</td><td id="p4"></td></tr></table></section><div class="buttons"><button id="reset">初期値に戻す</button><button class="primary" id="copy">計算結果をコピー</button></div><p class="note">※ メルカリ販売手数料は販売価格の10％（1円未満切り捨て）で計算。利益率＝利益÷販売価格、仕入れ利益率＝利益÷仕入れ価格。交通費、振込手数料、売れ残りなどは含みません。金額は自由に変更できます。</p></main><script>const ids=['cost','price','shipping','packing'];const el=Object.fromEntries(ids.map(x=>[x,document.getElementById(x)]));let last='';function yen(n){return Math.round(n).toLocaleString('ja-JP')+'円'}function update(){let v=Object.fromEntries(ids.map(k=>[k,Math.max(0,Number(el[k].value)||0)]));let fee=Math.floor(v.price*.1),profit=v.price-fee-v.cost-v.shipping-v.packing;document.getElementById('profit').textContent=yen(profit);document.getElementById('profit').classList.toggle('loss',profit<0);document.getElementById('margin').textContent=v.price?(profit/v.price*100).toFixed(1)+'%':'—';document.getElementById('roi').textContent=v.cost?(profit/v.cost*100).toFixed(1)+'%':'—';[['p1',v.price],['fee',-fee],['p2',-v.cost],['p3',-v.shipping],['p4',-v.packing]].forEach(([id,n])=>document.getElementById(id).textContent=(n<0?'−':'')+yen(Math.abs(n)));last=`販売価格 ${yen(v.price)} / 仕入れ ${yen(v.cost)} / 手数料 ${yen(fee)} / 送料 ${yen(v.shipping)} / 梱包 ${yen(v.packing)} / 利益 ${yen(profit)}`;}ids.forEach(k=>{el[k].addEventListener('input',update);el[k].addEventListener('focus',()=>setTimeout(()=>el[k].select(),0))});document.getElementById('reset').addEventListener('click',()=>{Object.entries({cost:110,price:600,shipping:160,packing:20}).forEach(([k,v])=>el[k].value=v);update()});document.getElementById('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(last);document.getElementById('copy').textContent='コピーしました ✓';setTimeout(()=>document.getElementById('copy').textContent='計算結果をコピー',1600)}catch(e){try{const t=document.createElement('textarea');t.value=last;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();document.getElementById('copy').textContent='コピーしました ✓';setTimeout(()=>document.getElementById('copy').textContent='計算結果をコピー',1600)}catch(_){alert('コピーできませんでした')}}});update();</script></body></html>
